<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #64748b;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .wave-line {
      fill: none;
      stroke-linecap: round;
      opacity: 0.35;
    }

    /* Subtle CSS Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.12); opacity: 0.55; }
    }
    @keyframes waveFloat {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .anim-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .anim-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .anim-wave-1 {
      animation: waveFloat 12s ease-in-out infinite;
    }
    .anim-wave-2 {
      animation: waveFloat 16s ease-in-out infinite reverse;
    }
    .radar-sweep {
      transform-origin: 1050px 100px;
      animation: radarSpin 12s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Orbs -->
  <circle class="anim-orb-1" cx="220" cy="110" r="180" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle class="anim-orb-2" cx="980" cy="290" r="210" fill="url(#glowGrad2)" filter="url(#blurFilter)" />

  <!-- Atmospheric Isobar / Streamline Waves (Dynamic Background) -->
  <g class="anim-wave-1">
    <path class="wave-line" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="8 6"
      d="M-50,80 Q250,20 500,80 T1050,90 T1300,60" />
    <path class="wave-line" stroke="#818cf8" stroke-width="1.4"
      d="M-50,140 Q300,200 650,130 T1250,170" />
    <path class="wave-line" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4"
      d="M-50,280 Q200,340 550,270 T1250,310" />
    <path class="wave-line" stroke="#c084fc" stroke-width="1.6"
      d="M-50,330 Q400,260 800,340 T1250,300" />
  </g>
  <g class="anim-wave-2">
    <path class="wave-line" stroke="#0284c7" stroke-width="2" opacity="0.2"
      d="M-50,200 Q350,110 750,210 T1250,150" />
  </g>

  <!-- Weather Radar Scanner Element (Background Right) -->
  <g opacity="0.35">
    <circle cx="1050" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="1050" cy="100" r="45" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="1050" cy="100" r="20" fill="none" stroke="#38bdf8" stroke-width="1" />
    <line x1="970" y1="100" x2="1130" y2="100" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" />
    <line x1="1050" y1="20" x2="1050" y2="180" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" />
    <path class="radar-sweep" d="M1050,100 L1120,80 A70,70 0 0,0 1050,30 Z" fill="url(#glowGrad1)" opacity="0.6" />
  </g>

  <!-- High-Tech Divider Line -->
  <rect x="100" y="235" width="1000" height="1.5" fill="url(#accentLine)" />

  <!-- Center Content: Title, Subtitle, Tagline (Strictly Foreground) -->
  <g text-anchor="middle">
    <!-- Icon/Badge Top -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="-110" cy="-2" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="10" y="3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ATMOSPHERIC INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" class="title" fill="url(#textGrad)" filter="url(#glow)">
      Awesome Atmospheric Modeling &amp; Weather Simulation
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" class="subtitle">
      Numerical Weather Prediction (NWP) • AI Weather Models • SaaS APIs • Climate Simulation
    </text>

    <!-- Tagline -->
    <text x="600" y="218" class="tagline">
      Curated ecosystem of enterprise weather platforms, mesoscale models, and open-source meteorological computing
    </text>

    <!-- Interactive / Dynamic Styled Category Pills in Foreground (y=265) -->
    <g transform="translate(140, 265)">
      <!-- Pill 1: Mesoscale NWP -->
      <g transform="translate(0, 0)">
        <rect width="160" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
        <circle cx="24" cy="21" r="4" fill="#38bdf8"/>
        <text x="92" y="26" class="pill-text" text-anchor="middle">⚡ WRF &amp; MPAS</text>
      </g>
      <!-- Pill 2: AI Weather Foundation -->
      <g transform="translate(180, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
        <circle cx="24" cy="21" r="4" fill="#818cf8"/>
        <text x="102" y="26" class="pill-text" text-anchor="middle">🧠 GraphCast &amp; Aurora</text>
      </g>
      <!-- Pill 3: Open-Meteo APIs -->
      <g transform="translate(380, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" opacity="0.95"/>
        <circle cx="24" cy="21" r="4" fill="#06b6d4"/>
        <text x="102" y="26" class="pill-text" text-anchor="middle">🌐 Open-Meteo APIs</text>
      </g>
      <!-- Pill 4: MetPy & xarray -->
      <g transform="translate(580, 0)">
        <rect width="170" height="42" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.95"/>
        <circle cx="24" cy="21" r="4" fill="#a855f7"/>
        <text x="96" y="26" class="pill-text" text-anchor="middle">📊 MetPy &amp; xarray</text>
      </g>
      <!-- Pill 5: Enterprise SaaS -->
      <g transform="translate(770, 0)">
        <rect width="150" height="42" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.95"/>
        <circle cx="22" cy="21" r="4" fill="#ec4899"/>
        <text x="86" y="26" class="pill-text" text-anchor="middle">🛰️ Satellite SaaS</text>
      </g>
    </g>

    <!-- Bottom Metadata Status Bar -->
    <g transform="translate(600, 355)">
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" letter-spacing="0.8">
        UPDATED MONTHLY • FREE &amp; OPEN-SOURCE VERIFIED • ENTERPRISE PRICING COMPARED
      </text>
    </g>
  </g>
</svg>
